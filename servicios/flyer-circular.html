<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>flyer circular — raku servicios</title>
  <style>
    @font-face {
      font-family: 'Zen Old Mincho';
      font-style: normal;
      font-weight: 700;
      src: url('../css/fuentes/zen-old-mincho-700-latin.woff2') format('woff2');
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1080px;
      height: 1350px;
      background: #BE3A34;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    .flyer {
      position: relative;
      width: 1080px;
      height: 1350px;
      padding: 80px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .foto-circular {
      position: relative;
      width: 620px;
      height: 620px;
      margin: 0 auto;
      border-radius: 50%;
      border: 5px solid #F7F1E4;
      overflow: hidden;
      background: #8C2A25;
    }
    .foto-circular img {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 130%;
      transform: translate(-50%, -50%);
      filter: saturate(1.1) contrast(1.05);
    }
    .titular {
      text-align: center;
      margin-top: 44px;
      line-height: 0.98;
    }
    .titular .chica {
      display: block;
      font-family: 'Zen Old Mincho', Georgia, serif;
      font-size: 2.2rem;
      color: #F7F1E4;
      font-weight: 700;
    }
    .titular .script {
      display: block;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-weight: 700;
      font-size: 5.6rem;
      color: #2B2420;
      -webkit-text-stroke: 2px #F7F1E4;
      margin: 4px 0;
    }
    .titular .grande {
      display: block;
      font-family: 'Zen Old Mincho', Georgia, serif;
      font-size: 4.4rem;
      color: #F7F1E4;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .titular .marca {
      display: block;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 3.4rem;
      color: #2B2420;
      -webkit-text-stroke: 1.5px #F7F1E4;
      margin-top: 6px;
    }
    .pie-marca {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .pie-marca svg { fill: #F7F1E4; }
    .pie-marca .nombre {
      font-size: 1.5rem;
      font-weight: 700;
      color: #F7F1E4;
    }
    .pie-marca .tag {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 1.3rem;
      color: #2B2420;
      -webkit-text-stroke: 0.6px #F7F1E4;
    }
  </style>
</head>
<body>
  <div class="flyer">
    <div class="foto-circular">
      <img src="../capturas/waveforge-torii.jpg" alt="Torii wireframe contra un ocaso synthwave">
    </div>

    <div class="titular">
      <span class="chica">El</span>
      <span class="script">real</span>
      <span class="chica">alcance</span>
      <span class="grande">DE TU MARCA</span>
      <span class="marca">en redes</span>
    </div>

    <div class="pie-marca">
      <svg viewBox="0 0 48 48" width="34" height="34" aria-hidden="true">
        <rect x="2" y="6" width="44" height="5" rx="1" />
        <rect x="22" y="11" width="4" height="6" />
        <rect x="7" y="17" width="34" height="4" rx="1" />
        <rect x="11" y="11" width="5" height="31" rx="1" />
        <rect x="32" y="11" width="5" height="31" rx="1" />
      </svg>
      <span class="nombre">raku</span>
      <span class="tag">servicios</span>
    </div>
  </div>
</body>
</html>
